<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f2f3f7;
}

/* HEADER */

.topbar{
height:80px;
background:#0b76d1;
display:flex;
align-items:center;
padding:0 22px;
color:white;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.menu-btn{
font-size:34px;
margin-right:25px;
cursor:pointer;
}

.page-title{
font-size:22px;
font-weight:500;
}

/* CONTENU */

.dashboard{
padding:20px;
}

/* CARTES */

.card{
height:130px;
border-radius:6px;
margin-bottom:35px;
position:relative;
box-shadow:0 2px 8px rgba(0,0,0,.18);
overflow:hidden;
}

/* ICÔNE */

.icon{
position:absolute;
left:15px;
top:10px;
font-size:18px;
color:white;
font-weight:600;
opacity:0.9;
}

/* TEXTE */

.card-right{
position:absolute;
right:25px;
top:45px;
text-align:right;
color:white;
}

.label{
font-size:18px;
font-weight:300;
text-transform:uppercase;
}

.value{
font-size:38px;
font-weight:300;
line-height:1;
margin-top:8px;
}

/* COULEURS */

.orange{
background:#ff9800;
}

.purple{
background:#6c3df0;
}

.blue{
background:#1aa0e3;
}

.green{
background:#08c443;
}

/* MENU LATÉRAL */

.sidebar{
position:fixed;
top:0;
left:-280px;
width:280px;
height:100%;
background:white;
box-shadow:3px 0 20px rgba(0,0,0,.2);
transition:.3s;
z-index:999;
}

.sidebar.active{
left:0;
}

.sidebar-header{
background:#0b76d1;
padding:25px;
color:white;
font-size:22px;
}

.profile-box{
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

.profile-photo{
width:80px;
height:80px;
border-radius:50%;
border:3px solid white;
object-fit:cover;
background:white;
margin-bottom:12px;
}

.profile-name{
font-size:18px;
font-weight:600;
margin-bottom:6px;
}

.profile-account{
font-size:14px;
opacity:.9;
margin-bottom:10px;
letter-spacing:1px;
}

.profile-balance{
background:rgba(255,255,255,.18);
padding:8px 18px;
border-radius:20px;
font-size:15px;
font-weight:600;
}

.sidebar a{
display:block;
padding:18px 25px;
text-decoration:none;
color:#222;
border-bottom:1px solid #eee;
font-size:15px;
}

.sidebar a:hover{
background:#f5f5f5;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.4);
display:none;
z-index:998;
}

.overlay.active{
display:block;
}

.logout{
color:#e53935 !important;
font-weight:600;
}

const data = [];

}

const chart = Highcharts.chart("graphique",{
    chart:{type:"line"},
    title:{text:null},
    credits:{enabled:false},
    series:[{data:data}]
});

setInterval(function(){
    chart.series[0].addPoint(Math.random()*100,true,true);
},1000);

});
</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
updateDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

/* CONFIG FIREBASE */
const firebaseConfig = {
    apiKey: "AIzaSyC5BKPy37U7-s32GFfuRiANAofNAG2H_2g",
    authDomain: "bcm-financiale-groupe.firebaseapp.com",
    projectId: "bcm-financiale-groupe",
    storageBucket: "bcm-financiale-groupe.firebasestorage.app",
    messagingSenderId: "319415437561",
    appId: "1:319415437561:web:c1c74ad588c6c5bd1afa28",
    measurementId: "G-LX9R32RLGS"
  };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* MENU */

const sidebar=document.getElementById("sidebar");
const menuBtn=document.getElementById("menuBtn");
const overlay=document.getElementById("overlay");

menuBtn.onclick=()=>{
sidebar.classList.add("active");
overlay.classList.add("active");
};

overlay.onclick=()=>{

sidebar.classList.remove("active");
overlay.classList.remove("active");

};


/* CONNEXION */

onAuthStateChanged(auth,async(user)=>{

if(!user){

window.location.replace("connecter.html");
return;

}

try{

const ref=doc(db,"utilisateurs",user.uid);

const snap=await getDoc(ref);

if(snap.exists()){

const data=snap.data();

await updateDoc(ref, {
    enLigne: true,
    derniereConnexion: serverTimestamp()
});

/* NOM */
document.getElementById("profileName").textContent =
`${data.prenom || ""} ${data.nom || ""}`;

/* PHOTO */
if(data.photo){
document.getElementById("profilePhoto").src = data.photo;
}else{
const prenom=data.prenom || "";
const nom=data.nom || "";

document.getElementById("profilePhoto").src =
`https://ui-avatars.com/api/?name=${encodeURIComponent(prenom+" "+nom)}&background=ffffff&color=0b76d1&size=200`;
}

/* 🔥 NUMÉRO DE COMPTE (CORRIGÉ) */
const numeroCompte = data.numeroCompte || "Non disponible";

document.getElementById("accountNumber").textContent = numeroCompte;
/* DEVISE ET CODE ISO */
const devise = data.devise || "";
const deviseISO = data.deviseISO || "";

/* ÉQUILIBRE (icône = ISO) */
document.getElementById("equilibreIcon").textContent = deviseISO;

/* SOLDE MENU */
const solde = data.solde || 0;

/* SOLDE MENU */
document.getElementById("menuSolde").textContent = solde + " " + devise;

/* SOLDE PRINCIPAL */
document.getElementById("userSolde").textContent = solde + " " + devise;

/* TOUJOURS 0 */
document.getElementById("userTransactions").textContent = "0";
document.getElementById("userDepot").textContent = "0";
document.getElementById("userTransfert").textContent = "0";

}else{

document.getElementById("profileName").textContent="Utilisateur";

document.getElementById("accountNumber").textContent =
"Compte : ------------";

document.getElementById("menuSolde").textContent="0";
document.getElementById("userSolde").textContent="0";
document.getElementById("userTransactions").textContent="0";
document.getElementById("userDepot").textContent="0";
document.getElementById("userTransfert").textContent="0";

}

}catch(error){

console.error(error);
alert(t.errorLoad);

}

});

/* DÉCONNEXION */

document.getElementById("logoutBtn").addEventListener("click",async()=>{

try{

await updateDoc(doc(db,"utilisateurs",auth.currentUser.uid), {
    enLigne: false,
    derniereConnexion: serverTimestamp()
});

await signOut(auth);
window.location.replace("connecter.html");

}catch(error){

alert(t.logoutError);

}

});

window.addEventListener("beforeunload", async () => {
    if(auth.currentUser){
        await updateDoc(doc(db,"utilisateurs",auth.currentUser.uid), {
            enLigne: false,
            derniereConnexion: serverTimestamp()
        });
    }
});

</script>
